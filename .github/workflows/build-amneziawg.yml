# Version 5.0-Production (Fixed APT Dependency Step for D-Link M30)
name: Build Custom AmneziaWG v3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'   # Pulls the stable 25.12 release source tree
          path: 'openwrt'

      - name: Install System Dependencies Safely
        run: |
          # The fix: prevent network/mirror hiccups from crashing the start phase
          sudo apt-get update -y || true
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          # Grabs the absolute latest live code branch from Slava's repo
          echo "src-git amneziawg https://github.com" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Target Architecture and Core Variables
        run: |
          cd openwrt
          # Select exact MediaTek Filogic hardware target architecture for D-Link Aquila M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Force build all required matching dependencies
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=m" >> .config
          
          # Include native core cryptography dependencies to avoid compilation symbol drops
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y" >> .config
          echo "CONFIG_PACKAGE_kmod-wireguard=y" >> .config
          
          make defconfig

      - name: Toolchain and Ordered Package Compilation
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # Clean build space first to reject stale headers
          make package/feeds/amneziawg/kmod-amneziawg/clean
          make package/feeds/amneziawg/amneziawg-tools/clean
          make package/feeds/amneziawg/luci-proto-amneziawg/clean
          
          # Compile the package stack cleanly from live source code
          make package/feeds/amneziawg/kmod-amneziawg/compile V=s -j$(nproc)
          make package/feeds/amneziawg/amneziawg-tools/compile V=s -j$(nproc)
          make package/feeds/amneziawg/luci-proto-amneziawg/compile V=s -j$(nproc)

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-v3-stable-25.12-apks
          path: openwrt/bin/**/*.apk
